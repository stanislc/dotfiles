# ============================================================================
# GENERAL OPTIONS
# ============================================================================

# Mouse support and terminal settings
set -g mouse on
bind -n M-MouseDown1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "select-pane -t = ; send-keys -M" "run-shell -b '$HOME/.config/tmux/scripts/alt-click-cursor.sh \"#{pane_id}\" \"#{mouse_x}\" \"#{mouse_y}\" \"#{cursor_x}\" \"#{cursor_y}\" \"#{pane_current_command}\"'"
set -g history-limit 15000
set -g default-terminal "tmux-256color"
# Preserve RGB color support for remote apps in xterm-compatible terminals.
set-option -sa terminal-overrides ",xterm*:Tc"
set -g set-clipboard on
set -g detach-on-destroy off # Don't exit from tmux when closing a session
set -sg escape-time 0
set -g focus-events on
set -g cursor-style blinking-block
set -g cursor-colour "#c8c8c8"
setw -g aggressive-resize on    # Size windows per-client, not per-session

# Window and pane numbering
set -g base-index 1                   # Start windows at 1, not 0
setw -g pane-base-index 1             # Start panes at 1, not 0
set -g set-titles on
set -g set-titles-string "#h|#S"
set-window-option -g pane-base-index 1
set-option -g renumber-windows on     # Renumber windows when one is closed

# Window behavior
set-option -g automatic-rename off
set-option -g allow-rename off
set-hook -g window-linked 'rename-window "Tab #{window_index}"'
setw -g window-style "fg=default,bg=default"
setw -g window-active-style "fg=default,bg=default"

# Allow visible panes to pass supported terminal queries through tmux.
set -g allow-passthrough off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Recognize PageUp/PageDown/Home/End and modified keys from macOS terminals.
set -g xterm-keys on
set -g extended-keys on
set -as terminal-features ',xterm*:extkeys:RGB,tmux*:extkeys:RGB,ghostty*:extkeys:RGB'

# Page keys: PageUp (and Globe+Up as C-Up) scrolls back; PageDown returns to
# the live bottom and exits copy mode on the next press.
bind-key -n PPage copy-mode -u
bind-key -n C-Up copy-mode -u
bind-key -n NPage copy-mode -e
bind-key -n C-Down copy-mode -e
bind-key -T copy-mode-vi NPage if-shell -F '[ #{scroll_position} = 0 ]' 'send-keys -X cancel' 'send-keys -X page-down'
bind-key -T copy-mode-emacs NPage if-shell -F '[ #{scroll_position} = 0 ]' 'send-keys -X cancel' 'send-keys -X page-down'
bind-key -T copy-mode-vi C-Down if-shell -F '[ #{scroll_position} = 0 ]' 'send-keys -X cancel' 'send-keys -X scroll-down'
bind-key -T copy-mode-emacs C-Down if-shell -F '[ #{scroll_position} = 0 ]' 'send-keys -X cancel' 'send-keys -X scroll-down'

# ============================================================================
# PREFIX KEY (backtick — fallback for power-user commands)
# ============================================================================

unbind C-b
set -g prefix `
bind ` send-keys '`'

# Configuration reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# PREFIX BINDINGS (power-user shortcuts, supplement Zellij modes)
# ============================================================================

# Pane splitting (open in current directory)
bind '"' split-window -v -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# New window in same path (c: next to current, C: at end)
bind c new-window -ac "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
bind-key S command-prompt -p "Session name:" "new-session -s '%%'"

# Pane resizing with leader + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Quick cycling: Alt+]/[ tabs, Alt+` panes
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-\` select-pane -t :.+

# Window reordering
bind-key -n M-i swap-window -t -1\; select-window -t -1
bind-key -n M-o swap-window -t +1\; select-window -t +1

# Alt+Arrow unbinds (M-Right/M-Left/M-Up/M-Down)
# M-f/M-b unbinds are in post-plugin section (after TPM) to override plugins
unbind -n M-Right
unbind -n M-Left
unbind -n M-Up
unbind -n M-Down

# Window popups (prefix-based)
bind O display-popup -w 80% -h 70% -E "$HOME/.config/tmux/scripts/session-fzf.sh"
# sesh is optional (brew-only in the package lists); bind only when present.
if-shell "command -v sesh" {
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind -N "last-session (via sesh) " o run-shell "sesh last"
}
bind k display-popup -w 90% -h 100% -E "tmux list-keys | fzf"
bind ? display-popup -w 68 -h 60% -E "~/.config/tmux/scripts/cheatsheet.sh"

# ============================================================================
# ZELLIJ-STYLE MODAL KEYBINDINGS
# ============================================================================

# Hint bar: hidden by default (status on), shown on mode entry (status 2)

# --- Tab mode (Ctrl+T) ---------------------------------------------------
bind -n C-t {
  set -g @hint " #[fg=#e5c07b,bold] TAB #[default] #[bold]n#[nobold] New  #[bold]x#[nobold] Close  #[bold]r#[nobold] Rename  #[bold]s#[nobold] Move→Session  #[bold]h#[nobold]/← Prev  #[bold]l#[nobold]/→ Next  #[bold]1-9#[nobold] Goto  #[bold]Esc#[nobold] ✕"
  set -g status 2
  switch-client -T tab-mode
}

bind -T tab-mode n      { new-window -ac "#{pane_current_path}" ; set -g status on }
bind -T tab-mode x      { kill-window ; set -g status on }
bind -T tab-mode r      { command-prompt -I "#W" "rename-window -- '%%'" ; set -g status on }
bind -T tab-mode s      { command-prompt -p "Move window to session:" "move-window -d -t '%%:'" ; set -g status on }
bind -T tab-mode h      { previous-window ; set -g status on }
bind -T tab-mode l      { next-window ; set -g status on }
bind -T tab-mode Left   { previous-window ; set -g status on }
bind -T tab-mode Right  { next-window ; set -g status on }
bind -T tab-mode 1      { select-window -t :1 ; set -g status on }
bind -T tab-mode 2      { select-window -t :2 ; set -g status on }
bind -T tab-mode 3      { select-window -t :3 ; set -g status on }
bind -T tab-mode 4      { select-window -t :4 ; set -g status on }
bind -T tab-mode 5      { select-window -t :5 ; set -g status on }
bind -T tab-mode 6      { select-window -t :6 ; set -g status on }
bind -T tab-mode 7      { select-window -t :7 ; set -g status on }
bind -T tab-mode 8      { select-window -t :8 ; set -g status on }
bind -T tab-mode 9      { select-window -t :9 ; set -g status on }
bind -T tab-mode Escape { set -g status on }

# --- Pane mode (Ctrl+P) --------------------------------------------------
bind -n C-p {
  set -g @hint " #[fg=#98c379,bold] PANE #[default] #[bold]n#[nobold] New↓  #[bold]r#[nobold] New→  #[bold]t#[nobold] Move→Tab  #[bold]s#[nobold] Move→Session  #[bold]x#[nobold] Close  #[bold]f#[nobold] Zoom  #[bold]z#[nobold] Frames  #[bold]c#[nobold] Rename  #[bold]hjkl#[nobold]/Arrows Nav  #[bold]Esc#[nobold] ✕"
  set -g status 2
  switch-client -T pane-mode
}

bind -T pane-mode n      { split-window -v -c "#{pane_current_path}" ; set -g status on }
bind -T pane-mode r      { split-window -h -c "#{pane_current_path}" ; set -g status on }
bind -T pane-mode t      { break-pane -d ; set -g status on }
bind -T pane-mode s      { command-prompt -p "Move pane to session:" "break-pane -d -t '%%:'" ; set -g status on }
bind -T pane-mode x      { kill-pane ; set -g status on }
bind -T pane-mode f      { resize-pane -Z ; set -g status on }
bind -T pane-mode z      { if-shell -F '#{==:#{@pane_frames},0}' 'set -g @pane_frames 1 ; set -g pane-border-lines double' 'set -g @pane_frames 0 ; set -g pane-border-lines spaces' ; set -g status on }
bind -T pane-mode c      { command-prompt -I "#T" "select-pane -T '%%'" ; set -g status on }
bind -T pane-mode h      { select-pane -L ; set -g status on }
bind -T pane-mode j      { select-pane -D ; set -g status on }
bind -T pane-mode k      { select-pane -U ; set -g status on }
bind -T pane-mode l      { select-pane -R ; set -g status on }
bind -T pane-mode Left   { select-pane -L ; set -g status on }
bind -T pane-mode Down   { select-pane -D ; set -g status on }
bind -T pane-mode Up     { select-pane -U ; set -g status on }
bind -T pane-mode Right  { select-pane -R ; set -g status on }
bind -T pane-mode Escape { set -g status on }

# --- Resize mode (Ctrl+N) — STICKY: stays in mode until Escape -----------
bind -n C-n {
  set -g @hint " #[fg=#c678dd,bold] RESIZE #[default] #[bold]h#[nobold]/← Shrink  #[bold]l#[nobold]/→ Grow  #[bold]j#[nobold]/↓ Grow  #[bold]k#[nobold]/↑ Shrink  #[bold]Esc#[nobold] ✕"
  set -g status 2
  switch-client -T resize-mode
}

bind -T resize-mode h      { resize-pane -L 2 ; switch-client -T resize-mode }
bind -T resize-mode l      { resize-pane -R 2 ; switch-client -T resize-mode }
bind -T resize-mode j      { resize-pane -D 2 ; switch-client -T resize-mode }
bind -T resize-mode k      { resize-pane -U 2 ; switch-client -T resize-mode }
bind -T resize-mode Left   { resize-pane -L 2 ; switch-client -T resize-mode }
bind -T resize-mode Right  { resize-pane -R 2 ; switch-client -T resize-mode }
bind -T resize-mode Down   { resize-pane -D 2 ; switch-client -T resize-mode }
bind -T resize-mode Up     { resize-pane -U 2 ; switch-client -T resize-mode }
bind -T resize-mode Escape { set -g status on }

# --- Scroll mode (Ctrl+S) — zellij-like scroll/search/copy ---------------
bind -n C-s {
  set -g @hint " #[fg=#e5c07b,bold] SCROLL #[default] #[bold]j#[nobold]/#[bold]k#[nobold] Line  #[bold]d#[nobold]/#[bold]u#[nobold] Half  #[bold]^F#[nobold]/#[bold]^B#[nobold] Page  #[bold]/#[nobold] Search  #[bold]n#[nobold]/#[bold]N#[nobold] Next/Prev  #[bold]v#[nobold] Select  #[bold]y#[nobold] Yank  #[bold]J#[nobold] Reflow  #[bold]E#[nobold] Edit  #[bold]q#[nobold]/Esc ✕"
  set -g status 2
  copy-mode
}

# --- Session mode (Ctrl+O) -----------------------------------------------
bind -n C-o {
  set -g @hint " #[fg=#56b6c2,bold] SESSION #[default] #[bold]d#[nobold] Detach  #[bold]n#[nobold] New  #[bold]w#[nobold] Switch  #[bold]x#[nobold] Kill  #[bold]Esc#[nobold] ✕"
  set -g status 2
  switch-client -T session-mode
}

bind -T session-mode d      { set -g status on ; detach-client }
bind -T session-mode n      { command-prompt -p "Session name:" "new-session -s '%%'" ; set -g status on }
unbind -T session-mode s
bind -T session-mode w      { choose-tree -s ; set -g status on }
bind -T session-mode x      { confirm-before -p "Kill session #S? (y/n)" kill-session ; set -g status on }
bind -T session-mode Escape { set -g status on }

# --- Locked mode (Ctrl+G) — disables all modes, keys pass through --------
bind -n C-g {
  set -g @hint " #[fg=#e06c75,bold] LOCKED #[default] All keys pass through. #[bold]^G#[nobold] Unlock"
  set -g @controls_locked 1
  set -g status off
  bind -n C-t send-keys C-t
  bind -n C-p send-keys C-p
  bind -n C-n send-keys C-n
  bind -n C-s send-keys C-s
  bind -n C-o send-keys C-o
  bind -n C-g { source-file ~/.config/tmux/tmux.conf }
}

# ============================================================================
# VI MODE & COPY MODE
# ============================================================================

# Reset pane style; hide hint bar when LEAVING copy mode (not entering)
set-hook -g pane-mode-changed {
  selectp -P default
  if-shell -F "#{pane_in_mode}" "" "if-shell -F '#{@controls_locked}' 'set -g status off' 'set -g status on'"
}

set-window-option -g mode-keys vi

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Clipboard: prefer OSC 52 for SSH/tmux hops, fall back locally.
if-shell "[ -x \"$HOME/.local/bin/osc-copy\" ]" {
  set -g copy-command "$HOME/.local/bin/osc-copy"
  set-hook -g after-set-buffer "run-shell 'tmux save-buffer - | ~/.local/bin/osc-copy'"
  set-hook -g after-load-buffer "run-shell 'tmux save-buffer - | ~/.local/bin/osc-copy'"
  bind-key -T copy-mode-vi y send-keys -X copy-pipe "$HOME/.local/bin/osc-copy" \; send-keys -X cancel
  bind-key -T copy-mode-vi Y send-keys -X copy-pipe "$HOME/.local/bin/osc-copy" \; send-keys -X cancel
  bind-key -T copy-mode-vi J send-keys -X copy-pipe "$HOME/.config/tmux/scripts/reflow-copy.sh" \; send-keys -X cancel
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "$HOME/.local/bin/osc-copy" \; send-keys -X cancel
} {
  if-shell "command -v pbcopy >/dev/null 2>&1" {
    set -g copy-command "pbcopy"
    set-hook -g after-set-buffer "run-shell 'tmux save-buffer - | pbcopy'"
    set-hook -g after-load-buffer "run-shell 'tmux save-buffer - | pbcopy'"
    bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy" \; send-keys -X cancel
    bind-key -T copy-mode-vi Y send-keys -X copy-pipe "pbcopy" \; send-keys -X cancel
    bind-key -T copy-mode-vi J send-keys -X copy-pipe "$HOME/.config/tmux/scripts/reflow-copy.sh" \; send-keys -X cancel
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "pbcopy" \; send-keys -X cancel
  } {
    if-shell "[ -n \"$DISPLAY\" ] && command -v xclip >/dev/null 2>&1" {
      set -g copy-command "xclip -selection clipboard"
      set-hook -g after-set-buffer "run-shell 'tmux save-buffer - | xclip -selection clipboard'"
      set-hook -g after-load-buffer "run-shell 'tmux save-buffer - | xclip -selection clipboard'"
      bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard" \; send-keys -X cancel
      bind-key -T copy-mode-vi Y send-keys -X copy-pipe "xclip -selection clipboard" \; send-keys -X cancel
      bind-key -T copy-mode-vi J send-keys -X copy-pipe "$HOME/.config/tmux/scripts/reflow-copy.sh" \; send-keys -X cancel
      bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "xclip -selection clipboard" \; send-keys -X cancel
    } {
      set -gu copy-command
      set-hook -gu after-set-buffer
      set-hook -gu after-load-buffer
      bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
      bind-key -T copy-mode-vi Y send-keys -X copy-selection-and-cancel
      bind-key -T copy-mode-vi J send-keys -X copy-pipe "$HOME/.config/tmux/scripts/reflow-copy.sh" \; send-keys -X cancel
      bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
    }
  }
}
bind-key -T copy-mode-vi q send-keys -X cancel

# Edit scrollback in $EDITOR (zellij's edit-scrollback feature, E to avoid vi e/word-end conflict)
bind-key -T copy-mode-vi E {
  send-keys -X cancel
  run-shell 'tmux capture-pane -pS -32768 > /tmp/tmux-scrollback-$$.txt && tmux split-window -h "${EDITOR:-nvim} /tmp/tmux-scrollback-$$.txt && rm -f /tmp/tmux-scrollback-$$.txt"'
}

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ============================================================================
# PLUGINS
# ============================================================================

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Functionality plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin Freed-Wu/tmux-digit

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'oluevaera/tmux-conda-inherit'
set -g @plugin 'timvw/tmux-assistant-resurrect'

# Quick copy and URL extraction
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'

# ============================================================================
# PLUGIN CONFIGURATION
# ============================================================================

# Tab numbers
set -g @digit-style number

# Floax (floating pane toggle: Alt+\)
set -g @floax-bind '-n M-\\'

# Resurrect + Continuum (session persistence across restarts)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @resurrect-pane-contents-history-limit '15000'

# Thumbs (Vimium-style hint copy — prefix+Space, auto-detect clipboard)
set -g @thumbs-osc52 1
set -g @thumbs-command 'tmux set-buffer -- "{}"'
set -g @thumbs-upcase-command 'tmux set-buffer -- "{}" && tmux paste-buffer'
set -g @thumbs-fg-color "#2a5a2a"
set -g @thumbs-bg-color "#E2FEDF"
set -g @thumbs-hint-fg-color "#5a1a1a"
set -g @thumbs-hint-bg-color "#FFD5D5"
set -g @thumbs-select-fg-color "#1a1a5a"
set -g @thumbs-select-bg-color "#D5E5FF"
set -g @thumbs-contrast 1

# fzf-url (prefix+u to pick and open URLs from pane)
set -g @fzf-url-bind 'u'

# ============================================================================
# STATUS LINE — Zellij layout: tab bar at top, hint bar at bottom
# One Dark accent colors (bg=terminal preserves terminal light/dark theme)
# ============================================================================

# One Dark palette (foreground accents only)
%hidden OD_RED="#e06c75"
%hidden OD_GREEN="#98c379"
%hidden OD_YELLOW="#e5c07b"
%hidden OD_BLUE="#61afef"
%hidden OD_MAGENTA="#c678dd"
%hidden OD_CYAN="#56b6c2"
%hidden OD_GREY="#5c6370"
%hidden OD_ORANGE="#FF9500"
%hidden OD_BRIGHT_GREY="#d8dde3"
%hidden OD_TAB_GREY="#b5beca"
%hidden OD_BLACK="#1b1f23"

# --- Pane borders (no tab bar, just separators) ---
set -g @pane_frames 1
set -g pane-border-status off
set -g pane-border-style "fg=#{OD_GREY}"
set -g pane-active-border-style "fg=#{OD_ORANGE}"
set -g pane-border-indicators colour
set -g pane-border-lines double

# --- Top: clickable tab bar (hidden when controls are locked) ---
set -g @controls_locked 0
set -g status on
set -g status-position top
# One Dark dark bar, muted accents
set -g status-style "bg=#21252b,fg=#5c6370"

set -g status-left-length 0
set -g status-right-length 80
set -g status-left ""
set -g status-right "#{?#{>=:#{session_windows},7},#[fg=#{OD_BRIGHT_GREY}] #h|#S ,}"
set -g window-status-format "#[fg=#{OD_TAB_GREY}] #I:#W "
# Use ASCII for the zoom marker to avoid width jitter in Moshi.
set -g window-status-current-format "#[bg=#{OD_GREEN},fg=#{OD_BLACK}] #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-separator ""
# Keep the native clickable window list, with a clickable help button
# immediately before it. Host|session stays centered until the window list
# grows crowded; then it moves into status-right.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[align=#{status-justify}]#[range=user|help]#[bg=#{OD_RED},fg=#{OD_BLACK}] ? #[nobg]#[norange default]#[list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}} #[nolist align=centre]#{?#{>=:#{session_windows},7},,#[fg=#{OD_BRIGHT_GREY}] #h|#S }#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# --- Bottom: auto-hide hint bar (shown via `set -g status 2` on mode entry) ---
set -g status-format[1] "#[bg=#2c313a,fg=#abb2bf,align=left]#{E:@hint}"

# Copy/scroll mode and message styling (adapts to light/dark mode)
set -g mode-style "bg=terminal,fg=terminal,reverse"
set -g message-style "bg=terminal,fg=terminal"
set -g message-command-style "bg=terminal,fg=terminal"

# ============================================================================
# INITIALIZE PLUGIN MANAGER
# ============================================================================

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# --- Post-plugin overrides (must be AFTER TPM to stick) ---
# tmux-digit rewrites #S into glyphs; keep plain host|session for Ghostty.
set -g set-titles on
set -g set-titles-string "#h|#S"

# When a session is intentionally killed, refresh the resurrect snapshot without
# running heavy assistant/pane-content post-save work.
set-hook -g session-closed 'run-shell -b "~/.config/tmux/scripts/save-after-session-close.sh"'

# Restore shell keys that plugins steal
unbind -n M-f       # Alt+Right word-jump (vim-tmux-navigator steals it)
unbind -n M-b       # Alt+Left word-jump (vim-tmux-navigator steals it)
unbind -n C-Space   # Set-mark in emacs mode (tmux-sensible steals it)

# Click the help marker on the status bar to open the cheatsheet; preserve
# native window switching for status clicks on window tabs.
unbind -n MouseDown1StatusRight
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},help}' 'display-popup -w 68 -h 60% -E "~/.config/tmux/scripts/cheatsheet.sh"' 'select-window -t ='
