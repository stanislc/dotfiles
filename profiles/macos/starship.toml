detect_files = [
  "pyproject.toml",
  "requirements.txt",
  "requirements-dev.txt",
  "setup.py",
  "setup.cfg",
  "tox.ini",
  "uv.lock",
  "poetry.lock",
]
detect_folders = []
format = 'via [${symbol}${version} (\($virtualenv\) )]($style)'

