"$schema" = 'https://starship.rs/config-schema.json'

[aws]
symbol = " "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "
detect_extensions = ["c", "h"]
commands = [["gcc-15", "--version"], ["gcc", "--version"], ["cc", "--version"]]

[cpp]
symbol = " "
disabled = false
detect_extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx", "h++"]
detect_files = ["CMakeLists.txt", "meson.build"]
detect_folders = []
commands = [["g++-15", "--version"], ["g++", "--version"], ["c++", "--version"]]

[cmake]
symbol = " "

[conda]
ignore_base = false
symbol = " "

