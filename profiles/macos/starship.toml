[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "yellow"

[battery]

[[battery.display]]
threshold = 20
style = 'bold red'

[[battery.display]] # 'bold yellow' style and 💦 symbol when capacity is between 10% and 30%
threshold = 30
style = 'bold yellow'

[[battery.display]] # 'bold yellow' style and 💦 symbol when capacity is between 10% and 30%
threshold = 10
style = 'bold green'
